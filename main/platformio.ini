[platformio]
# Tells PlatformIO to look for your code in the root folder instead of a 'src' folder
src_dir = .

# Password for wireless (OTA) uploads. Change it here -- it's used both when
# building the firmware and when uploading over Wi-Fi.
[ota]
password = watertank-ota

# ---- Upload over USB cable (default) ----
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

# Crucial for ESP32-C3 direct USB communication & serial monitoring
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D OTA_PASSWORD=\"${ota.password}\"

monitor_speed = 115200

# Automatically downloads your OLED display library
lib_deps =
    olikraus/U8g2 @ ^2.36.2

# ---- Upload over Wi-Fi (OTA) ----
# Use: PlatformIO sidebar -> env:ota -> Upload   (or: pio run -e ota -t upload)
# The board must be running and connected to the same Wi-Fi network.
[env:ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = watertank.local
# The board connects back to the PC on host_port to fetch the firmware, so
# Windows Firewall must allow inbound TCP on that port. One-time setup, in a
# PowerShell window opened with "Run as administrator":
#   New-NetFirewallRule -DisplayName "ESP32 OTA" -Direction Inbound -Protocol TCP -LocalPort 18180 -Action Allow -Profile Private
upload_flags =
    --auth=${ota.password}
    --host_port=18180
